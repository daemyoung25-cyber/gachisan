<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2F7D4F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="같이산">
<title>같이산</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root {
  --bg: #F3F5F1; --card: #FFFFFF; --ink: #1C2A21; --sub: #64716A; --line: #E1E6DF;
  --pri: #2F7D4F; --pri-ink: #FFFFFF; --pri-soft: #E3F0E7; --rec: #D9472B; --seal: #C23B2A;
  --warn-bg: #FFF4DC; --warn-ink: #7A5200; --shadow: 0 2px 10px rgba(20, 40, 25, .08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111613; --card: #1B221D; --ink: #E7EDE8; --sub: #98A59C; --line: #2B352E;
    --pri: #4FAE74; --pri-ink: #0D1A12; --pri-soft: #1F3326; --rec: #F0664A; --seal: #E8604E;
    --warn-bg: #3A2F14; --warn-ink: #F3D58C; --shadow: none;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  display: flex; flex-direction: column; overscroll-behavior: none;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
input, select { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
h1, h2, h3 { margin: 0; line-height: 1.3; }
.hidden { display: none !important; }

header.top { display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; background: var(--card); border-bottom: 1px solid var(--line); }
header.top h1 { font-size: 18px; letter-spacing: -.3px; }
header.top .grp { margin-left: auto; font-size: 13px; color: var(--sub); max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
main { flex: 1; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.pad { padding: 16px 16px 24px; }

nav.tabs { display: flex; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
nav.tabs button { flex: 1; padding: 8px 0 7px; font-size: 12px; color: var(--sub); display: flex; flex-direction: column; align-items: center; gap: 2px; }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button.on { color: var(--pri); font-weight: 600; }

.btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 16px; border-radius: 12px; font-weight: 600; background: var(--pri-soft); color: var(--pri); }
.btn.pri { background: var(--pri); color: var(--pri-ink); }
.btn.rec { background: var(--rec); color: #fff; }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.btn.danger { background: transparent; color: var(--rec); border: 1px solid var(--line); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; }
.card { background: var(--card); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.sub { color: var(--sub); font-size: 13px; }
.note { background: var(--warn-bg); color: var(--warn-ink); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: 13px; white-space: nowrap; }
.chip.on { background: var(--pri); border-color: var(--pri); color: var(--pri-ink); }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
label.field { display: block; margin: 12px 0 6px; font-size: 13px; color: var(--sub); }

/* record */
#v-rec { display: flex; flex-direction: column; overflow: hidden; }
#recmap { flex: 1; min-height: 160px; background: var(--line); }
.recpanel { background: var(--card); border-top: 1px solid var(--line); padding: 14px 16px 16px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; text-align: center; margin-bottom: 12px; }
.stats b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
.stats span { font-size: 12px; color: var(--sub); }
.near { font-size: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.near b { color: var(--pri); }
.gps { font-size: 12px; color: var(--sub); display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.gps .dot { background: #999; }
.gps.ok .dot { background: #2DB55D; } .gps.bad .dot { background: #E0A100; }
.bigstart { width: 100%; padding: 16px; font-size: 18px; border-radius: 14px; }
.mapbtn { position: absolute; z-index: 500; right: 12px; width: 42px; height: 42px; border-radius: 12px; background: var(--card); box-shadow: 0 2px 8px rgba(0,0,0,.2); display: grid; place-items: center; }
.mapbtn svg { width: 22px; height: 22px; }
.mapbtn.on { color: var(--pri); }

/* stamps */
.prog { display: flex; align-items: center; gap: 14px; }
.prog .ring { width: 74px; height: 74px; flex: none; }
.prog h2 { font-size: 26px; }
.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; margin-top: 12px; }
.cell { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 4px 7px; text-align: center; min-height: 74px; overflow: hidden; }
.cell .no { font-size: 10px; color: var(--sub); }
.cell .nm { font-size: 13px; font-weight: 600; line-height: 1.25; word-break: keep-all; white-space: pre-line; }
.cell .ht { font-size: 11px; color: var(--sub); }
.cell.done { border-color: color-mix(in srgb, var(--seal) 45%, var(--line)); }
.seal { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.seal i { width: 54px; height: 54px; border: 2.5px solid var(--seal); border-radius: 50%; color: var(--seal); display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 12px; line-height: 1.1; transform: rotate(-14deg); opacity: .82; background: color-mix(in srgb, var(--card) 35%, transparent); }
.seal i small { font-size: 9px; font-weight: 600; display: block; }
#stampmap { height: 62vh; border-radius: 16px; margin-top: 12px; }
.seg { display: flex; background: var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { flex: 1; padding: 7px; border-radius: 8px; font-size: 13px; color: var(--sub); }
.seg button.on { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }

/* feed */
.hike { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; }
.hike svg.thumb { width: 64px; height: 64px; flex: none; border-radius: 12px; background: var(--pri-soft); }
.hike .t { font-weight: 600; font-size: 16px; }
.list > * + * { margin-top: 10px; }
.empty { text-align: center; color: var(--sub); padding: 40px 16px; }

/* sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 1000; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 640px; max-height: 92vh; border-radius: 20px 20px 0 0; overflow-y: auto; padding: 8px 16px calc(env(safe-area-inset-bottom) + 20px); }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 10px; }
.sheet h2 { font-size: 21px; }
.sheet .map { height: 260px; border-radius: 14px; margin: 12px 0; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.kv div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.kv b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
.kv span { font-size: 12px; color: var(--sub); }
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 12px 0; }
.photos img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; display: block; }
.prof { width: 100%; height: 110px; display: block; }
.people { display: flex; flex-wrap: wrap; gap: 6px; }
.check { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.check input { width: 20px; height: 20px; accent-color: var(--pri); }
.lv { color: #E0A100; letter-spacing: 1px; }
.lvoff { color: var(--line); }
.photoview { position: fixed; inset: 0; background: #000; z-index: 1100; display: grid; place-items: center; }
.photoview img { max-width: 100%; max-height: 100%; }

#toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 80px); transform: translateX(-50%); background: #1C2A21; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 1200; max-width: calc(100% - 32px); text-align: center; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.show { opacity: 1; }
#boot { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 1300; color: var(--sub); }
.code { font-size: 28px; font-weight: 800; letter-spacing: 4px; font-variant-numeric: tabular-nums; text-align: center; padding: 8px; }
.leaflet-container { font: inherit; background: var(--line); }
.pin { background: var(--pri); color: #fff; border: 2px solid #fff; border-radius: 50%; width: 14px; height: 14px; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
.me-dot { width: 18px; height: 18px; border-radius: 50%; background: #2B7FFF; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(43,127,255,.25); }
.pic-pin { width: 30px; height: 30px; border-radius: 8px; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); background-size: cover; background-position: center; }
</style>
</head>
<body>
<div id="boot">불러오는 중…</div>
<header class="top"><h1>⛰️ 같이산</h1><span class="grp" id="grpname"></span></header>
<main>
  <section class="view" id="v-rec">
    <div style="position:relative;flex:1;display:flex;flex-direction:column">
      <div id="recmap"></div>
      <button class="mapbtn" id="follow" style="top:12px" aria-label="내 위치 따라가기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    </div>
    <div class="recpanel">
      <div class="gps" id="gps"><span class="dot"></span><span id="gpstxt">GPS 확인 중…</span></div>
      <div class="near hidden" id="near"></div>
      <div id="idle">
        <button class="btn rec bigstart" id="start">▶ 산행 시작</button>
        <p class="sub" style="margin:10px 0 0">기록 중에는 화면을 켜 두세요. 화면이 꺼지면 경로 일부가 빠질 수 있어요.</p>
      </div>
      <div id="running" class="hidden">
        <div class="stats">
          <div><b id="s-time">0:00</b><span>시간</span></div>
          <div><b id="s-dist">0.0</b><span>거리 km</span></div>
          <div><b id="s-alt">–</b><span>고도 m</span></div>
          <div><b id="s-gain">0</b><span>오른 높이 m</span></div>
        </div>
        <div class="row">
          <button class="btn" id="photo">📷 사진</button>
          <button class="btn ghost" id="pause">⏸ 쉬기</button>
          <button class="btn rec" id="stop">■ 끝내기</button>
        </div>
        <input type="file" id="photoin" accept="image/*" capture="environment" class="hidden">
      </div>
    </div>
  </section>

  <section class="view hidden" id="v-stamps"><div class="pad">
    <div class="prog">
      <svg class="ring" viewBox="0 0 36 36" id="ring"></svg>
      <div><h2 id="progn">0 / 100</h2><div class="sub" id="progsub">100대 명산 도장깨기</div></div>
    </div>
    <div class="chips" id="whochips" style="margin-top:14px"></div>
    <div class="row" style="margin-top:12px;align-items:center">
      <div class="seg" id="smode"><button data-m="board" class="on">도장판</button><button data-m="map">지도</button></div>
      <select id="prov" style="flex:0 0 108px"></select>
    </div>
    <div class="board" id="board"></div>
    <div id="stampmap" class="hidden"></div>
  </div></section>

  <section class="view hidden" id="v-feed"><div class="pad">
    <h2 style="font-size:20px;margin-bottom:12px">산행 기록</h2>
    <div class="list" id="feed"></div>
  </div></section>

  <section class="view hidden" id="v-fam"><div class="pad list" id="fam"></div></section>
</main>
<nav class="tabs" id="tabs">
  <button data-v="rec" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 20l6-11 4 6 3-4 5 9z"/></svg>기록</button>
  <button data-v="stamps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M8.5 12.5l2.3 2.3 4.7-5"/></svg>도장깨기</button>
  <button data-v="feed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 6h14M5 12h14M5 18h9"/></svg>산행</button>
  <button data-v="fam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="10" r="2.4"/><path d="M3 19c.6-3.3 3-5 6-5s5.4 1.7 6 5M15 15.2c2.6-.4 4.9.9 5.6 3.8"/></svg>가족</button>
</nav>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
